# Schraubenschublade planner
#
#   docker compose up -d --build   -> editor on http://localhost:8080
#                                     + the CadQuery build service on :8000
#
# Both services are in the default set. Exact CadQuery geometry is the point of this
# tool, not an add-on, so it is never behind a profile. The api image is large
# (~2.5 GB: CadQuery, trimesh, Playwright/Chromium) and the first build takes several
# minutes; after that it is layer-cached and `up -d` is immediate.
services:
  web:
    build: ./web
    image: schublade-web
    # web runs inside api's network namespace and proxies to 127.0.0.1:8000, so the
    # two never talk across a Docker network. Because of this, web's port is
    # published on the api service below.
    network_mode: "service:api"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    image: schublade-api
    # Docker's default bridge, not a compose project network. Some hosts only forward
    # traffic for docker0 (GitHub Codespaces: legacy iptables FORWARD policy DROP); on a
    # project network there, nginx got a 504 on /api/ and the label scrape could not
    # resolve label.alch.shop. docker0 works on every normal Docker host as well.
    network_mode: bridge
    ports:
      - "${WEB_PORT:-8080}:80"          # the editor (nginx in the web container)
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./generator:/app/generator:ro   # the two pipeline scripts, edit them on the host
      - ./cache:/data/cache             # scraped Chappel labels + generated bodies, reused
      - ./out:/data/out                 # anything the service writes for you
    environment:
      CACHE_DIR: /data/cache
      OUT_DIR: /data/out
    restart: unless-stopped
