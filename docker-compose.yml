# Schraubenschublade planner
#
#   docker compose up -d --build   -> editor on http://localhost:8080
#                                     + the CadQuery build service on :8000
#
# Both services are in the default set. Exact CadQuery geometry is the point of this
# tool, not an add-on, so it is never behind a profile. The api image is large
# (~2.5 GB: CadQuery, trimesh, Playwright/Chromium) and the first build takes several
# minutes; after that it is layer-cached and `up -d` is immediate.
services:
  web:
    build: ./web
    image: schublade-web
    # Both containers sit on Docker's default bridge and nginx reaches the api through the
    # host's published port (host.docker.internal = the docker0 gateway). They never share
    # a network namespace, so either one can be restarted on its own; sharing api's
    # namespace took the editor down whenever api restarted.
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      API_PORT: ${API_PORT:-8000}
    volumes:
      - ./web/public:/usr/share/nginx/html:ro   # the editor; host edits are live (served no-store)
      # nginx renders templates/*.template into conf.d at start, filling in ${API_PORT}
      - ./web/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    image: schublade-api
    # Docker's default bridge, not a compose project network. Some hosts only forward
    # traffic for docker0 (GitHub Codespaces: legacy iptables FORWARD policy DROP); on a
    # project network there, nginx got a 504 on /api/ and the label scrape could not
    # resolve label.alch.shop. docker0 works on every normal Docker host as well.
    network_mode: bridge
    # A runaway CadQuery boolean once used all RAM and rebooted the Codespace; with a cap
    # only this container is killed.
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./generator:/app/generator:ro   # the two pipeline scripts, edit them on the host
      - ./api/app.py:/app/app.py:ro     # the service itself; `docker compose restart api` applies edits
      - ./cache:/data/cache             # scraped Chappel labels + generated bodies, reused
      - ./out:/data/out                 # anything the service writes for you
    environment:
      CACHE_DIR: /data/cache
      OUT_DIR: /data/out
    restart: unless-stopped
