[project]
name = "schublade-api"
version = "0.1.0"
description = "Build service for the Schraubenschublade planner (CadQuery pipeline wrapper)."
# cadquery 2.8 requires >= 3.12. It is also the first release that accepts
# cadquery-ocp 7.9.x, which is the oldest OCP with a linux-aarch64 wheel.
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "cadquery==2.8.0",
    "trimesh==4.5.3",
    # numpy is deliberately unpinned: cadquery 2.8's numba/llvmlite chain rejects 2.1.3.
    "numpy>=2.1",
    "shapely==2.0.6",
    "networkx==3.4.2",
    "fonttools==4.65.0",   # label text: glyph outlines and GPOS kerning of the label font
    "manifold3d==3.5.4",   # mesh booleans: the label pocket cut (about 15x faster than OCC)
    "mapbox-earcut==2.1.0",  # polygon triangulation for trimesh's extrude_polygon
]

[dependency-groups]
# Only for tools/download_label_assets.py (one-off, refreshes generator/assets from the
# label website). The image installs with --no-dev, so it carries no browser.
dev = [
    "playwright==1.49.1",
]

[tool.uv]
# There is no importable package here — app.py is copied in and run by uvicorn.
package = false
