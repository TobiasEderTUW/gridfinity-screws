# Builds the two images and pushes them to the GitHub Container Registry:
#   ghcr.io/<owner>/gridfinity-screws-api   CadQuery build service (carries generator/)
#   ghcr.io/<owner>/gridfinity-screws-web   nginx + the editor + the label font
# Tags: `latest` and `main` from the default branch, `sha-<short>` for every build,
# `1.2.3` / `1.2` for a `v1.2.3` git tag. Pull requests build but push nothing.
name: docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # The api image is ~4.4 GB unpacked; the runner's free disk is tight enough that the
      # preinstalled toolchains we never use are worth removing first.
      - name: Free disk space
        if: matrix.name == 'api'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name (ghcr refuses upper case owners).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gridfinity-screws-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
