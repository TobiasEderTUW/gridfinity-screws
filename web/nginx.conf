server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS, resolved at request time rather than at startup, so nginx
  # still comes up if the api container is restarting or briefly unavailable.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }

  location /api/ {
    set $api http://api:8000;
    proxy_pass $api$request_uri;
    proxy_set_header Host $host;
    proxy_read_timeout 1800s;      # a full CadQuery batch can run for a long time
    proxy_send_timeout 1800s;
    proxy_intercept_errors off;
  }
}
