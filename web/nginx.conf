server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/json font/ttf image/svg+xml text/css application/javascript;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }

  # the label font is 8 MB and never changes; the editor itself stays no-store
  location /fonts/ {
    types { font/ttf ttf; text/plain txt; }
    add_header Cache-Control "public, max-age=604800";
  }

  location /api/ {
    # the api's port as published on the host (see docker-compose.yml); ${API_PORT} is
    # filled in by the nginx image's template step
    proxy_pass http://host.docker.internal:${API_PORT};
    proxy_set_header Host $host;
    proxy_read_timeout 1800s;      # a full CadQuery batch can run for a long time
    proxy_send_timeout 1800s;
    proxy_intercept_errors off;
  }
}
