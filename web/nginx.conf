server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }

  location /api/ {
    # the api's port as published on the host (see docker-compose.yml); ${API_PORT} is
    # filled in by the nginx image's template step
    proxy_pass http://host.docker.internal:${API_PORT};
    proxy_set_header Host $host;
    proxy_read_timeout 1800s;      # a full CadQuery batch can run for a long time
    proxy_send_timeout 1800s;
    proxy_intercept_errors off;
  }
}
