server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }

  location /api/ {
    # web shares the api container's network namespace (see docker-compose.yml)
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 1800s;      # a full CadQuery batch can run for a long time
    proxy_send_timeout 1800s;
    proxy_intercept_errors off;
  }
}
